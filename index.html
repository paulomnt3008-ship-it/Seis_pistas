<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seis Pistas de Movimiento</title>
  <meta name="claude:viewport-fit-sides" content="cover">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=Hanken+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <!-- Estilos globales (los de cada componente los carga js/core/loader.js) -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/track-layout.css">

  <!-- Librerías de animación (Alpine se carga al final desde js/main.js) -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/config/tailwind.config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Punto de entrada -->
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="wrap">
    <!-- Cada data-component se reemplaza por components/<nombre>/<nombre>.html -->
    <div data-component="ruler"></div>
    <main>
      <div data-component="hero"></div>
      <div data-component="track-css"></div>
      <div data-component="track-tailwind"></div>
      <div data-component="track-gsap"></div>
      <div data-component="track-anime"></div>
      <div data-component="track-three"></div>
      <div data-component="track-alpine"></div>
    </main>
    <div data-component="footer"></div>
    <div data-component="tai-button"></div>
  </div>
</body>
</html>
